<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 3px solid #0284c7; color: #0284c7; font-weight: bold; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .timeline-border { border-left: 2px solid #38bdf8; padding-left: 0.75rem; position: relative; }
        .timeline-border::before {
            content: ''; position: absolute; left: -5px; top: 0.25rem;
            width: 8px; height: 8px; border-radius: 50%; background: #0284c7;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 max-w-md mx-auto shadow-2xl min-h-screen relative overflow-x-hidden">

        <p id="trip-subtitle" class="text-xs text-sky-100 mt-1 opacity-90"></p>
    </header>

    <nav class="flex bg-white shadow-sm border-b sticky top-[76px] z-40 text-center text-xs font-medium">
        <button onclick="switchTab('itinerary')" id="btn-itinerary" class="flex-1 py-3 tab-active flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-calendar-day text-sm"></i>每日行程</button>

        <button onclick="switchTab('flight')" id="btn-flight" class="flex-1 py-3 text-slate-500 flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-plane-departure text-sm"></i>航班集合</button>
        <button onclick="switchTab('tools')" id="btn-tools" class="flex-1 py-3 text-slate-500 flex flex-col items-center gap-1 transition-colors"><i class="fa-solid fa-toolbox text-sm"></i>工具須知</button>
    </nav>

    <main id="tab-itinerary" class="p-4 space-y-5 animate-fade-in">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <button onclick="toggleRoomList()" class="w-full p-3 flex justify-between items-center bg-sky-50 text-sky-800 font-bold text-sm hover:bg-sky-100 transition-colors">
                <span><i class="fa-solid fa-bed mr-2"></i>團員房號分配表</span>
                <i class="fa-solid fa-chevron-down transition-transform duration-300" id="room-toggle-icon"></i>
            </button>
            <div id="room-list-container" class="hidden p-3 max-h-80 overflow-y-auto space-y-2 bg-white"></div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl p-3 text-xs shadow-sm">
            <div class="flex justify-between items-center">
                <div>
                    <p class="font-bold text-slate-800"><i class="fa-solid fa-cloud-sun-rain text-sky-500 mr-1"></i><span id="weather-title"></span></p>
                    <p class="text-slate-500 mt-1" id="weather-info">連接氣象資料中...</p>
                </div>
                <button onclick="fetchWeather()" class="bg-sky-50 text-sky-700 border border-sky-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-sky-100 transition-colors"><i class="fa-solid fa-rotate-right mr-1"></i>更新</button>
            </div>
        </div>

        <div id="itinerary-container" class="space-y-5"></div>
    </main>

    <main id="tab-checklist" class="p-4 space-y-4 hidden animate-fade-in">

        </div>
        <div id="checklist-container" class="space-y-4"></div>
    </main>

    <main id="tab-flight" class="p-4 space-y-4 hidden animate-fade-in">

    <main id="tab-tools" class="p-4 space-y-4 hidden animate-fade-in">
        <div id="tools-container"></div>

        // ================================================================
        // 三、通用輔助函數
        // ================================================================
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function googleMapsUrl(query) {
            return `https://maps.google.com/?q=${encodeURIComponent(query)}`;
        }

        function createElementFromHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = html.trim();
            return template.content.firstElementChild;
        }

        // ================================================================
        // 四、頁籤
        // ================================================================
        function switchTab(tabName) {
            const tabs = ['itinerary', 'checklist', 'flight', 'tools'];
            tabs.forEach(tab => {
                const content = document.getElementById('tab-' + tab);
                const btn = document.getElementById('btn-' + tab);
                if (!content || !btn) return;
                if (tab === tabName) {
                    content.classList.remove('hidden');
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-slate-500');
                } else {
                    content.classList.add('hidden');
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-slate-500');
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        // 五、旅遊主資料 → UI
        // ================================================================
        function renderMeta() {
            const { meta } = TOUR_DATA;
            document.title = `${meta.title}行程手冊`;
            document.getElementById('page-title').textContent = `${meta.title}行程手冊`;
            document.getElementById('trip-code').textContent = `團號：${meta.id}`;
            document.getElementById('trip-airline').innerHTML = `<i class="fa-solid fa-plane"></i> ${escapeHtml(meta.airline)}`;
            document.getElementById('trip-title').textContent = meta.title;
            document.getElementById('trip-subtitle').textContent = `${meta.dateRangeText} | 領隊：${meta.leader}`;
            document.getElementById('weather-title').textContent = meta.weatherTitle;
        }

        function renderItinerary() {
            const container = document.getElementById('itinerary-container');
            container.innerHTML = '';

            TOUR_DATA.itinerary.forEach(day => {
                const itemHtml = day.items.map(item => {
                    const badge = item.badge
                        ? `<span class="bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded text-xs mr-1">${escapeHtml(item.badge)}</span>`
                        : '';
                    const titleHtml = item.mapQuery
                        ? `<a href="${googleMapsUrl(item.mapQuery)}" target="_blank" rel="noopener noreferrer" class="font-bold text-sky-600 hover:text-sky-800 transition-colors block"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(item.title)}</a>`
                        : `<p class="font-bold text-slate-800">${badge}${escapeHtml(item.title)}</p>`;

                    const extraHtml = item.extra
                        ? `<p class="font-bold text-slate-800 mt-1">${badge}${escapeHtml(item.extra)}</p>`
                        : '';
                    const descriptionHtml = item.description
                        ? `<p class="text-xs text-slate-500 mt-1 leading-relaxed">${escapeHtml(item.description)}</p>`
                        : '';
                    const alertHtml = item.alert
                        ? `<p class="text-xs text-red-600 font-bold mt-1">${escapeHtml(item.alert)}</p>`
                        : '';

                    return `
                        <div class="timeline-border${item.noTimelineBorder ? ' border-transparent' : ''}">
                            <p class="text-xs text-slate-400 font-medium mb-0.5">${escapeHtml(item.time)}</p>
                            ${titleHtml}
                            ${extraHtml}
                            ${descriptionHtml}
                            ${alertHtml}
                        </div>
                    `;
                }).join('');

                let hotelHtml = '';
                if (day.hotel) {

                                    <p class="font-bold text-slate-800 text-sm">${escapeHtml(day.hotel.name)} <span class="text-xs font-normal text-slate-500 ml-1">(${escapeHtml(day.hotel.suffix || '')})</span></p>
                                </div>
                            </div>
                        `;
                    } else {
                        hotelHtml = `

                                    <button onclick="copyText('${escapeHtml(day.hotel.address)}')" class="text-xs bg-white border border-slate-200 px-2 py-1 rounded text-slate-600 hover:bg-slate-100 ml-2 shrink-0 shadow-sm transition-colors"><i class="fa-regular fa-copy"></i> 地址</button>
                                </div>
                                <div class="grid grid-cols-2 gap-2 text-xs">
                                    <a href="https://www.google.com/maps/search/supermarket+near+${encodeURIComponent(day.hotel.name)}" target="_blank" rel="noopener noreferrer" class="bg-emerald-50 text-emerald-700 border border-emerald-200 py-1.5 px-2 rounded-lg text-center font-bold hover:bg-emerald-100 transition-colors"><i class="fa-solid fa-cart-shopping mr-1"></i>周邊超市</a>
                                    <a href="https://www.google.com/maps/search/laundromat+near+${encodeURIComponent(day.hotel.name)}" target="_blank" rel="noopener noreferrer" class="bg-indigo-50 text-indigo-700 border border-indigo-200 py-1.5 px-2 rounded-lg text-center font-bold hover:bg-indigo-100 transition-colors"><i class="fa-solid fa-jug-detergent mr-1"></i>自助洗衣</a>
                                </div>
                            </div>
                        `;
                    }
                }

                const dayNode = createElementFromHtml(`
                    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-end border-b pb-2 border-slate-100">
                            <span class="text-xl font-black text-sky-600 tracking-tight">DAY ${day.day} <span class="text-sm text-slate-400 font-medium ml-1">${escapeHtml(day.date)}</span></span>
                            <span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded font-medium">降雨 <span id="rain-${day.weatherDay}" class="font-bold text-slate-700">--</span>% | <span id="temp-${day.weatherDay}" class="font-bold text-slate-700">--</span>°C</span>
                        </div>
                        <div class="space-y-4 text-sm mt-3">${itemHtml}</div>
                        ${hotelHtml}
                    </section>
                `);
                container.appendChild(dayNode);
            });
        }

        function renderFlight() {
            const contactContainer = document.getElementById('contact-container');
            contactContainer.innerHTML = `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                    <h3 class="font-bold border-b pb-2 text-slate-800"><i class="fa-solid fa-users text-sky-500 mr-2"></i>聯絡資訊</h3>
                    <ul class="text-sm space-y-3 mt-3">
                        ${TOUR_DATA.contact.map(item => `
                            <li class="flex justify-between border-b border-slate-50 pb-2 last:border-b-0 last:pb-0">
                                <span class="text-slate-500">${escapeHtml(item.label)}</span>
                                ${item.href ? `<a href="${item.href}" class="${item.className || 'font-bold'}">${escapeHtml(item.value)}</a>` : `<span class="font-bold">${escapeHtml(item.value)}</span>`}
                            </li>

                    </ul>
                </div>
            `;

            const flightList = document.getElementById('flight-list');
            flightList.innerHTML = TOUR_DATA.flights.map((flight, index) => `
                <div class="relative pl-4 border-l-2 border-slate-200${index === TOUR_DATA.flights.length - 1 ? ' border-transparent' : ''}">
                    <div class="absolute w-3 h-3 ${flight.highlight ? 'bg-sky-500' : 'bg-slate-400'} rounded-full -left-[7px] top-1 border-2 border-white"></div>
                    <p class="font-bold text-slate-800 text-base">${escapeHtml(flight.type)} ${escapeHtml(flight.flight)}</p>
                    <p class="text-xs text-slate-500 mt-1">${escapeHtml(flight.note)}</p>
                    <p class="text-sm font-black ${flight.highlight ? 'text-sky-700' : 'text-slate-700'} mt-1">${escapeHtml(flight.time)}</p>
                </div>
            `).join('');
        }

        function renderTools() {
            const tools = TOUR_DATA.tools;
            document.getElementById('tools-container').innerHTML = `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <h3 class="font-bold border-b border-slate-100 pb-2 text-slate-800 mb-3"><i class="fa-solid fa-link text-sky-500 mr-2"></i>${escapeHtml(tools.vjw.title)}</h3>
                    <a href="${tools.vjw.url}" target="_blank" rel="noopener noreferrer" class="bg-blue-600 text-white text-center py-2.5 px-4 rounded-xl font-bold shadow-md flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors">
                        <i class="fa-solid fa-passport"></i>${escapeHtml(tools.vjw.button)}
                    </a>
                    <p class="text-xs text-slate-400 text-center mt-2">${escapeHtml(tools.vjw.note)}</p>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <h3 class="font-bold border-b border-slate-100 pb-2 text-slate-800 mb-3"><i class="fa-solid fa-calculator text-sky-500 mr-2"></i>${escapeHtml(tools.currency.title)} (匯率 ${tools.currency.rate})</h3>
                    <div class="flex items-center gap-2 text-sm bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <input type="number" id="jpy-input" placeholder="輸入日幣 ¥" oninput="convertCurrency()" class="w-1/2 p-2.5 border rounded-lg focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 font-bold bg-white">
                        <span class="text-lg font-black text-slate-400 mx-1">➔</span>
                        <span id="twd-output" class="text-lg font-black text-emerald-600 flex-1 text-right">0 ${escapeHtml(tools.currency.unit)}</span>
                    </div>
                </div>

                <div class="bg-blue-50 rounded-2xl p-4 shadow-sm border border-blue-200">
                    <h3 class="font-bold border-b border-blue-200 pb-2 text-blue-900 mb-2"><i class="fa-solid fa-utensils mr-2"></i>${escapeHtml(tools.etiquette.title)}</h3>
                    <ul class="text-xs space-y-2 text-blue-800 leading-relaxed">
                        ${tools.etiquette.items.map(text => `<li><i class="fa-solid fa-check text-blue-500 mr-1"></i>${text}</li>`).join('')}
                    </ul>
                </div>

                <div class="bg-amber-50 rounded-2xl p-4 shadow-sm border border-amber-200">
                    <h3 class="font-bold border-b border-amber-200 pb-2 text-amber-900 mb-2"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${escapeHtml(tools.localRules.title)}</h3>
                    <ul class="text-xs space-y-2 text-amber-800 leading-relaxed">
                        ${tools.localRules.items.map(text => `<li><i class="fa-solid fa-car text-amber-600 mr-1"></i>${text}</li>`).join('')}
                    </ul>
                </div>

                <div class="bg-red-50 rounded-2xl p-4 shadow-sm border border-red-200">
                    <h3 class="font-bold border-b border-red-200 pb-2 text-red-900 mb-2"><i class="fa-solid fa-truck-medical mr-2"></i>緊急求助聯絡</h3>
                    <ul class="text-xs space-y-2 text-red-800">
                        ${tools.emergency.map(text => `<li>${text}</li>`).join('')}
                    </ul>
                </div>
            `;
            restoreJpyInput();
        }

        // ================================================================
        // 六、房號共同資料：GitHub rooms.txt
        // ================================================================
        function parseRoomsText(text) {
            const result = {};
            const lines = String(text || '').split(/\r?\n/);
            lines.forEach(rawLine => {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) return;
                const separatorIndex = line.indexOf('|');
                if (separatorIndex < 0) return;
                const id = line.slice(0, separatorIndex).trim();
                const room = line.slice(separatorIndex + 1).trim();
                if (/^\d+$/.test(id)) {
                    result[id] = room;
                }
            });
            return result;
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = SHARED_DATA.requestTimeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        async function loadSharedRooms({ silent = false } = {}) {
            const currentSequence = ++roomsRequestSequence;
            if (!silent) setRoomStatus('共同房號資料同步中...', 'normal');
            try {
                const cacheBustedUrl = `${SHARED_DATA.roomsUrl}${SHARED_DATA.roomsUrl.includes('?') ? '&' : '?'}t=${Date.now()}`;
                const response = await fetchWithTimeout(cacheBustedUrl, {
                    method: 'GET',
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                if (currentSequence !== roomsRequestSequence) return;
                sharedRooms = parseRoomsText(text);
                renderRooms();
                setRoomStatus(`共同房號已更新 · ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`, 'success');
            } catch (error) {
                console.error('房號資料讀取失敗：', error);
                renderRooms();
                setRoomStatus('目前無法同步共同房號，仍可查閱已載入資料。', 'error');
            }
        }

        function renderRooms() {
            const container = document.getElementById('room-list-container');
            if (!container) return;

            const editorHeader = `
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-2">
                    <div class="flex items-center justify-between gap-2">
                        <div class="text-xs text-slate-500">
                            <span class="font-bold text-slate-700">房號狀態：</span>
                            <span id="room-edit-status">${guideUnlocked ? '導遊編輯模式' : '查閱模式'}</span>
                        </div>
                        <button type="button" onclick="promptGuidePassword()" class="text-xs ${guideUnlocked ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-slate-600 border-slate-200'} border px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-100 transition-colors">
                            <i class="fa-solid ${guideUnlocked ? 'fa-unlock' : 'fa-lock'} mr-1"></i>${guideUnlocked ? '已解鎖' : '導遊修改'}
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">無密碼僅能查閱；導遊密碼可修改全部團員房號。</p>
                    <p id="room-status" class="text-[11px] mt-1 text-slate-400"></p>
                </div>
            `;

            const rows = TOUR_DATA.members.map(member => {
                const room = sharedRooms[String(member.id)] || '';
                const safeRoom = escapeHtml(room);
                if (guideUnlocked) {
                    return `
                        <div class="flex items-center text-sm border-b border-slate-100 pb-2 pt-1 gap-2">
                            <span class="w-16 text-slate-500 font-bold text-xs bg-slate-100 py-1.5 px-2 rounded text-center shrink-0">${escapeHtml(member.name)}</span>
                            <input type="text" id="room_input_${member.id}" value="${safeRoom}" onkeydown="handleRoomKeydown(event, ${member.id})" class="flex-1 min-w-0 p-1.5 border border-slate-200 rounded-md focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm transition-shadow" placeholder="房號">
                            <button type="button" onclick="saveRoom(${member.id})" class="bg-sky-600 text-white px-2.5 py-1.5 rounded-md text-xs font-bold hover:bg-sky-700 transition-colors shrink-0"><i class="fa-solid fa-floppy-disk"></i></button>
                        </div>
                    `;
                }
                return `
                    <div class="flex items-center text-sm border-b border-slate-100 pb-2 pt-1 gap-2">
                        <span class="w-16 text-slate-500 font-bold text-xs bg-slate-100 py-1.5 px-2 rounded text-center shrink-0">${escapeHtml(member.name)}</span>
                        <span class="flex-1 min-w-0 p-1.5 border border-slate-100 bg-slate-50 rounded-md text-sm text-slate-700 font-semibold min-h-[32px]">${safeRoom || '<span class="text-slate-300 font-normal">尚未填寫</span>'}</span>
                    </div>
                `;
            }).join('');

            container.innerHTML = editorHeader + rows;
            const status = document.getElementById('room-status');
            if (status && !status.textContent) setRoomStatus('', 'normal');
        }

        function setRoomStatus(message, type = 'normal') {
            const status = document.getElementById('room-status');
            if (!status) return;
            status.textContent = message;
            status.className = 'text-[11px] mt-1 ' + (
                type === 'success' ? 'text-emerald-600' :
                type === 'error' ? 'text-red-600' :
                'text-slate-400'
            );
        }

        function promptGuidePassword() {
            if (guideUnlocked) {
                guideUnlocked = false;
                renderRooms();
                setRoomStatus('已退出導遊編輯模式。', 'normal');
                return;
            }
            const password = window.prompt('請輸入導遊修改密碼：');
            if (password === null) return;
            if (!password.trim()) {
                alert('未輸入密碼，目前維持查閱模式。');
                return;
            }
            guideUnlocked = password.trim();
            renderRooms();
            setRoomStatus('導遊編輯模式已開啟；實際寫入時仍會由伺服器再次驗證密碼。', 'success');
        }

        function handleRoomKeydown(event, memberId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveRoom(memberId);
            }
        }

        async function saveRoom(memberId) {
            if (!guideUnlocked) {
                alert('目前為查閱模式，需輸入導遊修改密碼才能修改房號。');
                return;
            }

            const input = document.getElementById(`room_input_${memberId}`);
            if (!input) return;
            const room = input.value.trim();
            if (room && !/^[0-9A-Za-z\-]{1,12}$/.test(room)) {
                alert('房號請輸入 1～12 碼的英數字或連字號。');
                input.focus();
                return;
            }

            const originalText = input.value;
            input.disabled = true;
            setRoomStatus('正在寫入 GitHub 共同資料...', 'normal');

            try {
                if (!SHARED_DATA.writeEndpoint || SHARED_DATA.writeEndpoint.includes('YOUR-WORKER')) {
                    throw new Error('尚未設定 Cloudflare Worker 寫入網址。');
                }

                const response = await fetchWithTimeout(SHARED_DATA.writeEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tourId: TOUR_DATA.meta.id,
                        memberId,
                        room,
                        password: guideUnlocked
                    })
                });

                let payload = null;
                try { payload = await response.json(); } catch (_) {}
                if (!response.ok) {
                    throw new Error(payload?.error || `HTTP ${response.status}`);
                }

                sharedRooms[String(memberId)] = room;
                renderRooms();
                setRoomStatus(`已更新 ${getMemberName(memberId)} 的房號。其他裝置重新整理後即可看到，系統也會自動輪詢。`, 'success');
            } catch (error) {
                input.disabled = false;
                input.value = originalText;
                console.error('房號寫入失敗：', error);
                alert(`房號寫入失敗：\n${error.message}`);
                setRoomStatus('房號尚未寫入 GitHub。', 'error');
            }
        }

        function getMemberName(memberId) {
            return TOUR_DATA.members.find(member => member.id === Number(memberId))?.name || `團員 ${memberId}`;
        }

        function toggleRoomList() {
            const container = document.getElementById('room-list-container');
            const icon = document.getElementById('room-toggle-icon');
            const willOpen = container.classList.contains('hidden');
            if (willOpen) {
                container.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
                loadSharedRooms({ silent: true });
            } else {
                container.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // ================================================================
        // 七、行前清單：保留每台裝置自己的 localStorage
        // ================================================================
        function initChecklist() {
            const container = document.getElementById('checklist-container');
            const savedState = readJsonStorage(STORAGE_KEY_CHECKLIST, {});
            let html = '';

            TOUR_DATA.checklist.forEach((group, gIndex) => {
                html += `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4"><h4 class="font-black text-slate-800 border-b border-slate-100 pb-2 mb-3 text-sm"><i class="fa-solid fa-thumbtack text-sky-500 mr-2"></i>${escapeHtml(group.category)}</h4><div class="space-y-3">`;
                group.items.forEach((item, iIndex) => {
                    const key = `chk_${gIndex}_${iIndex}`;
                    const isChecked = !!savedState[key];
                    const isCheckedAttr = isChecked ? 'checked' : '';
                    const textStyle = isChecked ? 'line-through text-slate-400' : 'text-slate-700 font-medium';
                    html += `
                        <label class="flex items-start gap-3 text-sm cursor-pointer group">
                            <input type="checkbox" id="${key}" ${isCheckedAttr} onchange="saveChecklist('${key}')" class="mt-0.5 w-5 h-5 text-sky-600 rounded border-slate-300 focus:ring-sky-500 transition-colors cursor-pointer">
                            <span id="label_${key}" class="${textStyle} transition-all duration-200 select-none group-hover:text-sky-700">${escapeHtml(item)}</span>
                        </label>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function readJsonStorage(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (error) {
                console.warn(`讀取 localStorage 失敗：${key}`, error);
                return fallback;
            }
        }

        function saveChecklist(key) {
            const checkbox = document.getElementById(key);
            if (!checkbox) return;
            const savedState = readJsonStorage(STORAGE_KEY_CHECKLIST, {});
            savedState[key] = checkbox.checked;
            try {
                localStorage.setItem(STORAGE_KEY_CHECKLIST, JSON.stringify(savedState));
            } catch (error) {
                console.warn('Checklist 寫入 localStorage 失敗：', error);
            }

            const label = document.getElementById(`label_${key}`);
            if (!label) return;
            if (checkbox.checked) {
                label.classList.add('line-through', 'text-slate-400');
                label.classList.remove('text-slate-700', 'font-medium', 'group-hover:text-sky-700');
            } else {
                label.classList.remove('line-through', 'text-slate-400');
                label.classList.add('text-slate-700', 'font-medium', 'group-hover:text-sky-700');
            }
        }

        // ================================================================
        // 八、工具函數
        // ================================================================
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('已成功複製地址：\n' + text);
            } catch (error) {
                alert('複製失敗，請手動選取複製。');
            }
        }

        function convertCurrency() {
            const input = document.getElementById('jpy-input');
            const output = document.getElementById('twd-output');
            if (!input || !output) return;
            const jpy = Number(input.value) || 0;
            const twd = Math.round(jpy * TOUR_DATA.tools.currency.rate);
            output.innerText = `${twd.toLocaleString()} ${TOUR_DATA.tools.currency.unit}`;
            try { localStorage.setItem(STORAGE_KEY_JPY, input.value); } catch (error) {}
        }

        function restoreJpyInput() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_JPY);
                const input = document.getElementById('jpy-input');
                if (input && saved !== null) {
                    input.value = saved;
                    convertCurrency();
                }
            } catch (error) {}
        }

        // ================================================================
        // 九、氣象
        // ================================================================
        async function fetchWeather() {
            const infoLabel = document.getElementById('weather-info');
            infoLabel.innerText = '資料同步中...';
            try {
                const { latitude, longitude, timezone } = TOUR_DATA.weather;
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,precipitation_probability_max&timezone=${encodeURIComponent(timezone)}`;
                const response = await fetchWithTimeout(url, { cache: 'no-store' }, 12000);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data?.daily) throw new Error('氣象資料格式不完整');

                const temps = data.daily.temperature_2m_max || [];
                const rains = data.daily.precipitation_probability_max || [];
                infoLabel.innerText = `預測最高溫 ${temps[0] ?? '--'}°C，降雨機率 ${rains[0] ?? '--'}%`;

                TOUR_DATA.itinerary.forEach((day, index) => {
                    const tempNode = document.getElementById(`temp-${day.weatherDay}`);
                    const rainNode = document.getElementById(`rain-${day.weatherDay}`);
                    if (tempNode && temps[index] !== undefined) tempNode.innerText = temps[index];
                    if (rainNode && rains[index] !== undefined) rainNode.innerText = rains[index];
                });
            } catch (error) {
                console.error('氣象資料取得失敗：', error);
                infoLabel.innerText = '無法取得即時資料 (平均氣溫 27~30°C)';
            }
        }

        // ================================================================
        // 十、共同房號自動輪詢
        // ================================================================
        function startRoomsPolling() {
            stopRoomsPolling();
            roomsPollTimer = setInterval(() => {
                loadSharedRooms({ silent: true });
            }, SHARED_DATA.pollIntervalMs);
        }

        function stopRoomsPolling() {
            if (roomsPollTimer) {
                clearInterval(roomsPollTimer);
                roomsPollTimer = null;
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopRoomsPolling();
            else {
                loadSharedRooms({ silent: true });
                startRoomsPolling();
            }
        });

        // ================================================================
        // 十一、初始化
        // ================================================================
        window.addEventListener('load', async () => {
            renderMeta();
            renderItinerary();
            renderFlight();
            renderTools();
            initChecklist();
            renderRooms();
            await Promise.allSettled([
                fetchWeather(),
                loadSharedRooms({ silent: false })
            ]);
            startRoomsPolling();
        });
    </script>
</body>
</html>
